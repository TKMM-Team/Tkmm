name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      release: ${{ steps.release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version-without-v }}

    steps:
      - name: Get Version
        uses: battila7/get-version-action@v2.2.1
        id: version

      - name: Create Release
        uses: actions/create-release@v1
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: TotK Mod Manager - ${{ steps.version.outputs.version }}

  publish:
    needs: release
    permissions: write-all
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows (x64)
            kind: zip
            runtime: win-x64
            runtime_name: win-x64
          - name: Windows (arm64)
            kind: zip
            runtime: win-arm64
            runtime_name: win-arm64
          - name: Linux (x64)
            kind: zip
            runtime: linux-x64
            runtime_name: linux-x64
          - name: Linux (arm64)
            kind: zip
            runtime: linux-arm64
            runtime_name: linux-arm64
          - name: AppImage (x64)
            kind: appimage
            runtime: linux-x64
          - name: AppImage (arm64)
            kind: appimage
            runtime: linux-arm64
          - name: macOS (x64)
            kind: macos
            runtime: osx-x64
          - name: macOS (arm64)
            kind: macos
            runtime: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4.0.0
        with:
          dotnet-version: "10.x.x"

      - name: Publish
        if: matrix.kind != 'macos'
        shell: bash
        run: |
          dotnet publish src/Tkmm \
            -c Release \
            -o Tkmm-${{ matrix.runtime }} \
            -r ${{ matrix.runtime }} \
            --sc true \
            --version-suffix ${{ needs.release.outputs.version }} \
            -p:Version=${{ needs.release.outputs.version }} \
            -p:DebugType=embedded \
            -p:IsReadonlyFileSystem=${{ matrix.kind == 'appimage' }}

      - name: Archive Build
        if: matrix.kind == 'zip'
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: ../Tkmm-${{ matrix.runtime_name }}.zip
          directory: Tkmm-${{ matrix.runtime }}
          path: ./**

      - name: Upload Zip
        if: matrix.kind == 'zip'
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: gh release upload "$GITHUB_REF_NAME" Tkmm-${{ matrix.runtime_name }}.zip

      - name: Build AppImage
        if: matrix.kind == 'appimage'
        shell: bash
        run: |
          mkdir -p tools
          wget -q -O tools/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x tools/appimagetool

          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          cp distribution/appimage/Tkmm.desktop AppDir/usr/share/applications/tkmm.desktop
          ln -s usr/share/applications/tkmm.desktop AppDir/Tkmm.desktop
          cp distribution/appimage/AppRun AppDir/AppRun
          cp distribution/appimage/tkmm.svg AppDir/tkmm.svg
          cp distribution/appimage/tkmm.svg AppDir/usr/share/icons/hicolor/scalable/apps/tkmm.svg

          cp -R Tkmm-${{ matrix.runtime }}/* AppDir/usr/bin/

          chmod +x AppDir/AppRun AppDir/usr/bin/Tkmm*

          if [ "${{ matrix.runtime }}" = "linux-x64" ]; then
            ARCH_NAME=x64
            export ARCH=x86_64
          elif [ "${{ matrix.runtime }}" = "linux-arm64" ]; then
            ARCH_NAME=arm64
            export ARCH=aarch64
          else
            echo "Unexpected runtime ${{ matrix.runtime }}"
            exit 1
          fi

          export UFLAG="gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|*-$ARCH_NAME.AppImage.zsync"

          ./tools/appimagetool --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 21 -u "$UFLAG" AppDir
          mv ./*.AppImage Tkmm-${{ matrix.runtime }}.AppImage

      - name: Upload AppImage
        if: matrix.kind == 'appimage'
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: gh release upload "$GITHUB_REF_NAME" Tkmm-${{ matrix.runtime }}.AppImage

      - name: Build macOS
        if: matrix.kind == 'macos'
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: sh ./distribution/macos/build_macOS.sh ${{ matrix.runtime }}

      - name: Upload macOS packages
        if: matrix.kind == 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: gh release upload "$GITHUB_REF_NAME" Publish/Tkmm-${{ matrix.runtime }}.zip Publish/Tkmm-${{ matrix.runtime }}.dmg
