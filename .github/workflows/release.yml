name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      release: ${{ steps.release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version-without-v }}

    steps:
      - name: Get Version
        uses: battila7/get-version-action@v2.2.1
        id: version

      - name: Create Release
        uses: actions/create-release@v1
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: TotK Mod Manager - ${{ steps.version.outputs.version }}

  publish:
    needs: release
    permissions: write-all
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows (x64)
            kind: zip
            runtime: win-x64
          - name: Windows (arm64)
            kind: zip
            runtime: win-arm64
          - name: Linux (x64)
            kind: zip
            runtime: linux-x64
          - name: Linux (arm64)
            kind: zip
            runtime: linux-arm64
          - name: AppImage (x64)
            kind: appimage
            runtime: linux-x64
          - name: AppImage (arm64)
            kind: appimage
            runtime: linux-arm64
          - name: macOS (x64)
            kind: macos
            runtime: osx-x64
          - name: macOS (arm64)
            kind: macos
            runtime: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x.x"

      - name: Publish
        if: matrix.kind != 'macos'
        shell: bash
        run: |
          dotnet publish src/Tkmm \
            -c Release \
            -o Tkmm-${{ matrix.runtime }} \
            -r ${{ matrix.runtime }} \
            --sc true \
            --version-suffix ${{ needs.release.outputs.version }} \
            -p:Version=${{ needs.release.outputs.version }} \
            -p:DebugType=embedded \
            -p:IsReadonlyFileSystem=${{ matrix.kind == 'appimage' }}

      - name: Archive Build
        if: matrix.kind == 'zip'
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: ../Tkmm-${{ matrix.runtime }}.zip
          directory: Tkmm-${{ matrix.runtime }}
          path: ./**

      - name: Build AppImage
        if: matrix.kind == 'appimage'
        run: sh ./distribution/appimage/build_AppImage.sh ${{ matrix.runtime }}

      - name: Build macOS
        if: matrix.kind == 'macos'
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: sh ./distribution/macos/build_macOS.sh ${{ matrix.runtime }}

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: |
          if [ "${{ matrix.kind }}" = zip ]; then
            gh release upload "$GITHUB_REF_NAME" "Tkmm-${{ matrix.runtime }}.zip"
          elif [ "${{ matrix.kind }}" = appimage ]; then
            gh release upload "$GITHUB_REF_NAME" "Tkmm-${{ matrix.runtime }}.AppImage"
          elif [ "${{ matrix.kind }}" = macos ]; then
            gh release upload "$GITHUB_REF_NAME" "Publish/Tkmm-${{ matrix.runtime }}.zip" "Publish/Tkmm-${{ matrix.runtime }}.dmg"
          fi
