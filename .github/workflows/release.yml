name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Get Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TotK Mod Manager - ${{ github.ref_name }}

  publish:
    needs: release
    permissions: write-all
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows (x64)
            kind: zip
            runtime: win-x64
          - name: Windows (arm64)
            kind: zip
            runtime: win-arm64
          - name: Linux (x64)
            kind: zip
            runtime: linux-x64
          - name: Linux (arm64)
            kind: zip
            runtime: linux-arm64
          - name: AppImage (x64)
            kind: appimage
            runtime: linux-x64
          - name: AppImage (arm64)
            kind: appimage
            runtime: linux-arm64
          - name: macOS (x64)
            kind: macos
            runtime: osx-x64
          - name: macOS (arm64)
            kind: macos
            runtime: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x.x"

      - name: Publish
        if: matrix.kind != 'macos'
        shell: bash
        run: |
          dotnet publish src/Tkmm \
            -c Release \
            -o Tkmm-${{ matrix.runtime }} \
            -r ${{ matrix.runtime }} \
            --sc true \
            --version-suffix ${{ needs.release.outputs.version }} \
            -p:Version=${{ needs.release.outputs.version }} \
            -p:DebugType=embedded \
            -p:UseApplicationDataFolder=${{ matrix.kind == 'appimage' }}

      - name: Archive Build
        if: matrix.kind == 'zip'
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: ../Tkmm-${{ matrix.runtime }}.zip
          directory: Tkmm-${{ matrix.runtime }}
          path: ./**

      - name: Build AppImage
        if: matrix.kind == 'appimage'
        run: sh ./distribution/appimage/build_AppImage.sh ${{ matrix.runtime }}

      - name: Build macOS
        if: matrix.kind == 'macos'
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: sh ./distribution/macos/build_macOS.sh ${{ matrix.runtime }}

      - name: Publish CLI
        if: matrix.kind != 'appimage'
        shell: bash
        run: |
          dotnet publish src/Tkmm.CLI \
            -c Release \
            -o Tkmm.CLI-${{ matrix.runtime }} \
            -r ${{ matrix.runtime }} \
            --sc true \
            --version-suffix ${{ needs.release.outputs.version }} \
            -p:Version=${{ needs.release.outputs.version }} \
            -p:DebugType=embedded\
            -p:UseApplicationDataFolder=${{ matrix.kind == 'macos' }}

      - name: Archive CLI Build
        if: matrix.kind != 'appimage'
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: ../Tkmm.CLI-${{ matrix.runtime }}.zip
          directory: Tkmm.CLI-${{ matrix.runtime }}
          path: ./**

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.kind }}" = zip ]; then
            gh release upload "$GITHUB_REF_NAME" "Tkmm-${{ matrix.runtime }}.zip"
          elif [ "${{ matrix.kind }}" = appimage ]; then
            gh release upload "$GITHUB_REF_NAME" "Tkmm-${{ matrix.runtime }}.AppImage"
          elif [ "${{ matrix.kind }}" = macos ]; then
            gh release upload "$GITHUB_REF_NAME" "Publish/Tkmm-${{ matrix.runtime }}.zip" "Publish/Tkmm-${{ matrix.runtime }}.dmg"
          fi
          if [ "${{ matrix.kind }}" != 'appimage' ]; then
            gh release upload "$GITHUB_REF_NAME" "Tkmm.CLI-${{ matrix.runtime }}.zip"
          fi
